<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Form registration</title>
  </head>
  <body>
    <!-- This file exists only so Netlify registers the quote-request form at build time. -->
    <!-- It is never shown to visitors; the real form lives in src/components/QuoteForm.tsx. -->
    <form name="quote-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="mobile" />
      <input type="text" name="fromLocation" />
      <input type="text" name="toLocation" />
      <input type="text" name="moveType" />
      <input type="text" name="moveDate" />
      <input type="text" name="estimateMin" />
      <input type="text" name="estimateMax" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
